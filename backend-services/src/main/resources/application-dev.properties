spring.datasource.url=jdbc:h2:mem:studygenie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# spring.jpa.show-sql=true # Enable this to log SQL queries
spring.h2.console.enabled=true

# DEV ONLY. Real environments MUST provide JWT_SECRET via the environment; never reuse this value anywhere else.
jwt.secret=dev-only-not-a-secret-change-me-in-any-real-environment-0123456789

ai-engine.base-url=http://localhost:8000/v1
ai-engine.internal-token=changeme_to_at_least_16_chars_long
internal.n8n-token=dev-n8n-token-change-me

