spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=studygenie;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# DEV ONLY. Real environments MUST provide JWT_SECRET via the environment; never reuse this value anywhere else.
jwt.secret=dev-only-not-a-secret-change-me-in-any-real-environment-0123456789

ai-engine.base-url=http://localhost:8000/v1
ai-engine.internal-token=changeme_to_at_least_16_chars_long
internal.n8n-token=dev-n8n-token-change-me
