spring.datasource.url=jdbc:h2:mem:studygenie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# spring.jpa.show-sql=true # Enable this to log SQL queries
spring.h2.console.enabled=false

jwt.secret=dev-only-not-a-secret-change-me-in-any-real-environment-0123456789 # DEV ONLY, real environments MUST provide JWT_SECRET
