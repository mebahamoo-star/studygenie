spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studygenie?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:115658}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# HikariCP Cloud Connection Tuning (handles cloud network latency & idle disconnects)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# DEV ONLY. Real environments MUST provide JWT_SECRET via the environment; never reuse this value anywhere else.
jwt.secret=dev-only-not-a-secret-change-me-in-any-real-environment-0123456789

ai-engine.base-url=http://localhost:8000/v1
ai-engine.internal-token=changeme_to_at_least_16_chars_long
internal.n8n-token=dev-n8n-token-change-me
