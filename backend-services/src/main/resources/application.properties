spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://ep-lingering-surf-ba33xvh8.c-8.eu-central-1.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASS:npg_47nJGFUdYEmp}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Cloud Connection Tuning (Optimized for Neon Serverless)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:0}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8080}

spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt.secret=${JWT_SECRET:super_secret_jwt_key_that_is_long_enough_for_hs256_algorithm}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.issuer=${JWT_ISSUER:studygenie}
jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXPIRATION_MS:2592000000}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# AI Engine configuration
ai-engine.base-url=${AI_ENGINE_URL:http://ai-engine:8000/v1}
ai-engine.internal-token=${AI_INTERNAL_TOKEN:changeme_to_at_least_16_chars_long}
ai-engine.connect-timeout=5s
ai-engine.read-timeout=60s

# Resilience4j
resilience4j.retry.instances.aiEngine.max-attempts=3
resilience4j.retry.instances.aiEngine.wait-duration=2s
resilience4j.retry.instances.aiEngine.retry-exceptions=com.studygenie.backend.exception.AiEngineUnavailableException,com.studygenie.backend.exception.AiEngineTimeoutException

resilience4j.circuitbreaker.instances.aiEngine.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiEngine.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.aiEngine.wait-duration-in-open-state=10s

# Multipart limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator Health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Gamification Configuration
gamification.xp-per-action.QUIZ_PASSED=50
gamification.xp-per-action.FLASHCARDS_REVIEWED=20
gamification.xp-per-action.SYLLABUS_UPLOADED=100

gamification.daily-cap-per-action.QUIZ_PASSED=500
gamification.daily-cap-per-action.FLASHCARDS_REVIEWED=200
gamification.daily-cap-per-action.SYLLABUS_UPLOADED=100

gamification.streak-badge-threshold-days=3
