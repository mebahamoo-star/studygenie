spring.application.name=backend-services
server.port=8080

# Test In-Memory H2 Database (Never touch cloud Supabase DB in tests)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test-db-pass
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable startup sample seeders during tests unless explicitly enabled
app.data-initializer.enabled=false

# AI Engine Integration
ai-engine.base-url=http://localhost:8000
ai-engine.timeout-seconds=5
ai-engine.internal-token=dev-internal-token-change-me

# Internal n8n Token
internal.n8n-token=dev-n8n-token-change-me

# JWT Configuration
jwt.secret=dev-only-not-a-secret-change-me-in-any-real-environment-0123456789
jwt.issuer=studygenie
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000
jwt.remember-me-expiration-ms=2592000000

# OAuth2 Configuration
oauth.google.client-id=
oauth.microsoft.client-id=
oauth.microsoft.tenant-id=common
oauth.apple.client-id=

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Gamification Configuration
gamification.xp-per-action.QUIZ_PASSED=50
gamification.xp-per-action.FLASHCARDS_REVIEWED=20
gamification.xp-per-action.SYLLABUS_UPLOADED=100

gamification.daily-cap-per-action.QUIZ_PASSED=500
gamification.daily-cap-per-action.FLASHCARDS_REVIEWED=200
gamification.daily-cap-per-action.SYLLABUS_UPLOADED=100

gamification.streak-badge-threshold-days=3
