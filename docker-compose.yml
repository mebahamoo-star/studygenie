version: "3.9"

services:
  backend-services:
    build:
      context: ./backend-services
    container_name: studygenie-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on: []

  ai-engine:
    build:
      context: ./ai-engine
    container_name: studygenie-ai-engine
    ports:
      - "8000:8000"
    environment:
      - ENV=docker

  frontend:
    build:
      context: ./frontend
    container_name: studygenie-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-services

# Additional services (database, n8n, message broker) to be added
# as their configurations are finalized during development.
