version: "3.9"

services:
  backend-services:
    build:
      context: ./backend-services
    container_name: studygenie-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: studygenie-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=studygenie
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
    volumes:
      - mysql-data:/var/lib/mysql
    env_file:
      - .env

# TODO: uncomment once ai-engine/frontend folders exist
  ai-engine:
    build:
      context: ./ai-engine
    container_name: studygenie-ai-engine
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=docker
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_INTERNAL_TOKEN=${AI_INTERNAL_TOKEN}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL_PARSE=${LLM_MODEL_PARSE:-gemini-2.5-flash}
      - LLM_MODEL_STUDY_KIT=${LLM_MODEL_STUDY_KIT:-gemini-2.5-flash-lite}
      - LLM_THINKING_BUDGET=${LLM_THINKING_BUDGET:-0}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

