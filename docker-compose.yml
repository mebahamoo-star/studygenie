networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  db_data:
  n8n_data:

services:
  mysql:
    image: mysql:8.0
    container_name: studygenie_mysql
    networks:
      - internal
    environment:
      MYSQL_DATABASE: studygenie
      MYSQL_USER: studygenie_user
      MYSQL_PASSWORD: ${DB_PASS:?error MYSQL password missing}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?error MYSQL root password missing}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai-engine:
    build:
      context: ./ai-engine
    container_name: studygenie_ai
    networks:
      - internal
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?error AI_INTERNAL_TOKEN missing}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL_PARSE: ${LLM_MODEL_PARSE:-gemini-2.5-flash}
      LLM_MODEL_STUDY_KIT: ${LLM_MODEL_STUDY_KIT:-gemini-2.5-flash-lite}
      LLM_THINKING_BUDGET: ${LLM_THINKING_BUDGET:-0}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend-services
    container_name: studygenie_backend
    networks:
      - public
      - internal
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/studygenie
      DB_USER: studygenie_user
      DB_PASS: ${DB_PASS:?error DB_PASS missing}
      JWT_SECRET: ${JWT_SECRET:?error JWT_SECRET missing}
      AI_ENGINE_URL: http://ai-engine:8000/v1
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?error AI_INTERNAL_TOKEN missing}
    depends_on:
      mysql:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:1.64.0
    container_name: studygenie_n8n
    networks:
      - public
      - internal
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin}
      DB_TYPE: sqlite
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


