version: "3.9"

services:
  backend-services:
    build:
      context: ./backend-services
    container_name: studygenie-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: studygenie-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=studygenie
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
    volumes:
      - mysql-data:/var/lib/mysql
    env_file:
      - .env

